<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" fill="none">
  <defs>

    <!-- ORIGINAL: blue → cyan gradient. CHANGE: blue #1A6EFF → Voltline #C8FF00, cyan stays -->
    <linearGradient id="ringGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#C8FF00"/>   <!-- was: #1A6EFF blue  → now: Voltline -->
      <stop offset="55%"  stop-color="#00D4FF"/>   <!-- cyan — UNCHANGED -->
      <stop offset="100%" stop-color="#00E8FF"/>   <!-- light cyan — UNCHANGED -->
    </linearGradient>

    <!-- Same gradient for ECG line (was blue start, cyan end — now volt start, cyan end) -->
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C8FF00" stop-opacity="0"/>  <!-- volt fade in -->
      <stop offset="18%"  stop-color="#C8FF00" stop-opacity="0.9"/><!-- volt — was blue -->
      <stop offset="55%"  stop-color="#00D4FF"/>                   <!-- cyan — UNCHANGED -->
      <stop offset="100%" stop-color="#00E8FF" stop-opacity="0.4"/><!-- cyan fade — UNCHANGED -->
    </linearGradient>

    <!-- Inner subtle ring: volt tint replacing original blue tint, cyan stays -->
    <linearGradient id="innerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#C8FF00" stop-opacity="0.3"/><!-- volt — was blue -->
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.15"/><!-- cyan — UNCHANGED -->
    </linearGradient>

    <!-- F letter: white body with cyan diagonal accent — UNCHANGED -->
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCFFFE"/>   <!-- very subtle cyan tint — UNCHANGED -->
    </linearGradient>

    <!-- Outer ring glow filter -->
    <filter id="ringGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ECG line glow -->
    <filter id="ecgGlow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- F letter subtle glow -->
    <filter id="fGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Crosshair ticks glow -->
    <filter id="tickGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ─────────────────────────────────────────────
       OUTER RING — thick stroke, volt→cyan gradient
       (was blue→cyan, now volt→cyan)
  ───────────────────────────────────────────────── -->
  <!-- Ambient halo behind ring -->
  <circle cx="160" cy="162" r="124"
    fill="none"
    stroke="#C8FF00"
    stroke-width="22"
    stroke-opacity="0.06"/>

  <!-- Main ring -->
  <circle cx="160" cy="162" r="118"
    stroke="url(#ringGrad)"
    stroke-width="5.5"
    filter="url(#ringGlow)"/>

  <!-- Inner thin ring (secondary, subtle) -->
  <circle cx="160" cy="162" r="110"
    stroke="url(#innerRingGrad)"
    stroke-width="1"
    stroke-dasharray="3 8"
    stroke-opacity="0.5"/>

  <!-- ─────────────────────────────────────────────
       CROSSHAIR TICKS
       4 cardinal ticks — same as original (were cyan, stay cyan)
  ───────────────────────────────────────────────── -->
  <!-- Top -->
  <line x1="160" y1="32" x2="160" y2="46"
    stroke="#00D4FF" stroke-width="2" stroke-linecap="round"
    filter="url(#tickGlow)"/>
  <!-- Bottom -->
  <line x1="160" y1="278" x2="160" y2="292"
    stroke="#00D4FF" stroke-width="2" stroke-linecap="round"
    filter="url(#tickGlow)"/>
  <!-- Left -->
  <line x1="30" y1="162" x2="44" y2="162"
    stroke="#00D4FF" stroke-width="2" stroke-linecap="round"
    filter="url(#tickGlow)"/>
  <!-- Right -->
  <line x1="276" y1="162" x2="290" y2="162"
    stroke="#00D4FF" stroke-width="2" stroke-linecap="round"
    filter="url(#tickGlow)"/>

  <!-- ─────────────────────────────────────────────
       LETTER F — white, unchanged
       Same geometry, same white/cyan-tint look
  ───────────────────────────────────────────────── -->
  <g filter="url(#fGlow)">
    <!-- Vertical stem -->
    <rect x="126" y="122" width="16" height="82" rx="2.5" fill="url(#fGrad)"/>
    <!-- Top horizontal bar -->
    <rect x="126" y="122" width="62" height="16" rx="2.5" fill="url(#fGrad)"/>
    <!-- Middle horizontal bar (shorter, as in original) -->
    <rect x="126" y="156" width="48" height="14" rx="2.5" fill="url(#fGrad)"/>
  </g>

  <!-- ─────────────────────────────────────────────
       ECG / HEARTBEAT LINE
       volt start → cyan peak — was blue start → cyan
       Same shape, same terminal dot, same style
  ───────────────────────────────────────────────── -->
  <g filter="url(#ecgGlow)">
    <!-- ECG path — faithful recreation of original shape -->
    <path
      d="M 14,312
         L 92,312
         L 104,296
         L 118,334
         L 132,284
         L 146,326
         L 160,312
         L 258,312"
      stroke="url(#ecgGrad)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Terminal dot — cyan, UNCHANGED -->
    <circle cx="258" cy="312" r="3" fill="#00D4FF"/>
    <!-- Outer ring 1 -->
    <circle cx="258" cy="312" r="5.5"
      fill="none" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.45"/>
    <!-- Outer ring 2 -->
    <circle cx="258" cy="312" r="9"
      fill="none" stroke="#00D4FF" stroke-width="0.6" stroke-opacity="0.18"/>

    <!-- Tail after dot (fades out) -->
    <line x1="258" y1="312" x2="306" y2="312"
      stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25"/>
  </g>

</svg>
