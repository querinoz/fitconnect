name: android (Kotlin)

on:
  push:
    branches: [main, master, feature/**, qa/**]
    paths: ["android/**", "packages/design-tokens/**", "scripts/generate-kotlin-tokens.mjs", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "packages/design-tokens/**", "scripts/generate-kotlin-tokens.mjs", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: lint · unit tests · assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Generated Elite Surface tokens must match packages/design-tokens
      # (ADR-007). Fails the build on drift instead of shipping stale colors.
      - name: Check generated Kotlin tokens are in sync
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm tokens:kotlin:check

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (lint + unit tests + debug assemble)
        working-directory: android
        # SIGN-02: assembleRelease is fail-closed (requires keystore + Supabase + FCM).
        # CI without secrets must not claim a production release artifact.
        run: ./gradlew build -x :app:assembleRelease -x :app:bundleRelease -x :app:assembleReleaseUnitTest -x :wear:assembleRelease -x :wear:bundleRelease

      - name: Signed release (only when secrets present)
        if: ${{ secrets.FITCONNECT_ANDROID_KEYSTORE_BASE64 != '' && secrets.FITCONNECT_SUPABASE_URL != '' && secrets.FITCONNECT_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        working-directory: android
        env:
          FITCONNECT_SUPABASE_URL: ${{ secrets.FITCONNECT_SUPABASE_URL }}
          FITCONNECT_SUPABASE_ANON_KEY: ${{ secrets.FITCONNECT_SUPABASE_ANON_KEY }}
        run: |
          echo "::error::Signed release CI path is scaffolded but not fully wired (keystore decode + google-services.json injection). Keep fail-closed until human configures secrets + script."
          exit 1

      - name: Assert release remains fail-closed without secrets
        if: ${{ secrets.FITCONNECT_ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: |
          set +e
          ./gradlew :app:assembleRelease
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::assembleRelease succeeded without keystore — SIGN-02 violated"
            exit 1
          fi
          echo "SIGN-02 fail-closed verified (assembleRelease exited $code)"
