name: android (Kotlin)

on:
  push:
    branches: [main, master, feature/**, qa/**]
    paths: ["android/**", "packages/design-tokens/**", "scripts/generate-kotlin-tokens.mjs", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "packages/design-tokens/**", "scripts/generate-kotlin-tokens.mjs", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: lint · unit tests · assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Generated Elite Surface tokens must match packages/design-tokens
      # (ADR-007). Fails the build on drift instead of shipping stale colors.
      - name: Check generated Kotlin tokens are in sync
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm tokens:kotlin:check

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (lint + unit tests + assemble, all modules)
        working-directory: android
        run: ./gradlew build

      # connectedAndroidTest (instrumented) deliberately not wired yet:
      # needs an emulator runner (reactivecircus/android-emulator-runner)
      # and there are no instrumented tests until F3. Tracked in the F3 plan.
