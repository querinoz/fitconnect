name: CI

on:
  push:
    branches: [main, master, feature/**, feat/**]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

# Workflow default. NOTE: this makes Playwright E2E run against demo auth, so a
# green E2E is evidence about the demo path, not about production auth. The
# `auth-prod-like` job below is the only place DEMO_MODE=false is exercised.
# Migrating E2E onto real auth fixtures is tracked in
# docs/automation/AUTONOMOUS_MASTER_TODO.md (P1) -- do not read E2E green as
# production auth evidence until then.
env:
  NEXT_PUBLIC_DEMO_MODE: "true"
  NEXT_PUBLIC_REALTIME_PROVIDER: broadcast

jobs:
  lint-typecheck:
    name: Lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-gate-lint.mjs
      - run: pnpm lint
      # Expo @fitconnect/mobile archived (ADR-005 / Path A). Turbo 2.x hard-fails if a
      # --filter references a package that is not in the workspace — do not negate it.
      - run: pnpm typecheck
      - run: pnpm tokens:kotlin:check

  test-unit:
    name: Unit tests (web)
    runs-on: ubuntu-latest
    # Independent of lint-typecheck so a typecheck regression does not SKIP unit evidence.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitconnect/web test
      - run: pnpm --filter @fitconnect/api-client test
      # apps/mobile is frozen (ADR-005) — its tests no longer gate CI
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: apps/web/coverage/
          if-no-files-found: ignore

  auth-prod-like:
    name: Auth · DEMO_MODE=false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitconnect/web typecheck
      - run: pnpm --filter @fitconnect/web test:auth-prod

  # Wear OS debug assemble — hard gate in main CI.
  # Full Android lint/unit/release fail-closed suite remains in android.yml (path-filtered).
  android-wear:
    name: Android · Wear assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Wear debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :wear:assembleDebug

  test-coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    # No `needs`: this job runs `pnpm test:coverage`, which re-runs the suite itself and
    # consumes nothing from test-unit. Chaining it only meant a unit failure ALSO destroyed
    # the coverage evidence. release-gate still requires both to succeed.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  test-integration:
    name: Integration · DB · Pact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fitconnect
          POSTGRES_PASSWORD: fitconnect_test
          POSTGRES_DB: fitconnect_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fitconnect -d fitconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fitconnect:fitconnect_test@localhost:5433/fitconnect_test
      DIRECT_URL: postgresql://fitconnect:fitconnect_test@localhost:5433/fitconnect_test
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy

      # The supabase/migrations chain (001 -> 031) is applied to production by hand and had
      # never been executed as a chain anywhere. It is a second, independent source of schema
      # truth next to prisma/migrations, and nothing was proving the two agree -- or that a
      # rebuild from it even works. Measured 2026-09-12 on a fresh PostgreSQL 16: it applies
      # clean, but coach_profiles and reviews came out NOT anonymously readable, because they
      # relied on Supabase default privileges that 024 deliberately revoked. Production worked;
      # a rebuild silently lost the public coach directory. Migration 031 fixes it. This step
      # is what stops that class of bug coming back.
      #
      # A SEPARATE DATABASE on the same service, so this never interacts with the Prisma-built
      # schema the integration tests below run against.
      - name: Supabase migration chain from scratch + schema reconciliation
        env:
          CHAIN_URL: postgresql://fitconnect:fitconnect_test@localhost:5433/fitconnect_chain
        run: |
          set -euo pipefail
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'create database fitconnect_chain'

          # Supabase supplies these; a plain postgres:15-alpine service does not. Without them
          # every guarded GRANT/REVOKE in the chain is skipped and the grant invariants would be
          # checked against nothing -- a green run proving less than it appears to.
          psql "$CHAIN_URL" -v ON_ERROR_STOP=1 <<'PREREQ'
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin bypassrls; end if;
          end
          $roles$;
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as $fn$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $fn$;
          PREREQ

          DIRECT_URL="$CHAIN_URL" pnpm db:supabase:migrate
          DIRECT_URL="$CHAIN_URL" node scripts/db-reconcile-schema.mjs

      - run: pnpm --filter @fitconnect/db test:integration
      - run: pnpm test:integration
      - run: pnpm --filter @fitconnect/api-client exec vitest run src/pacts/consumer.contracts.pact.test.ts

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # BLOCKING. Critical advisories in the dependencies that actually ship.
      # This step previously ran with `continue-on-error: true`, which made the
      # job report success while `release-gate` counted it as a required PASS --
      # a green light with nothing behind it.
      #
      # The three production criticals that justified making it blocking are FIXED
      # and this step now passes (CI #39 on 1780b09, Security audit SUCCESS):
      #   next@15.5.23       -> 15.5.25  unauthenticated RCE (CVE-2026-75604) and
      #                                  Image Optimization RCE (GHSA-2xp9-vwfh-vxw4)
      #   maplibre-gl@5.24.0 -> 6.9.0    XSS sanitizer bypass (CVE-2026-85061)
      #
      # An earlier revision of this comment said "expect this job to be RED until
      # those land". They landed. A red security-audit is now a regression, not the
      # expected state -- do not accept one by citing a stale comment.
      # Production criticals measured on the branch lockfile: 0.
      # Do not re-add continue-on-error and do not lower --audit-level to pass.
      - name: Dependency audit (critical, production tree) — BLOCKING
        run: pnpm audit --audit-level critical --prod

      # Reported, not blocking. The high/moderate surface is large and needs
      # triage rather than a single switch; printing it keeps it visible instead
      # of hidden. Tracked in docs/automation/AUTONOMOUS_MASTER_TODO.md (P1).
      - name: Dependency audit (high, full tree) — report only
        run: pnpm audit --audit-level high || true

      # BLOCKING. sast.yml already runs semgrep as a hard gate on pull_request and
      # on main; running it soft here meant feature branches had no SAST gate at all.
      # Install via pip: `pnpm dlx semgrep` has no bin on some runners, and --quiet
      # hid findings from the job log.
      - name: Semgrep — BLOCKING
        run: |
          python3 -m pip install --quiet semgrep
          semgrep --version
          semgrep --config p/typescript --error apps/web packages scripts prisma

  build:
    name: Production build
    runs-on: ubuntu-latest
    # No `needs`: "does it compile?" is independent of "do the tests pass?". Chaining this
    # behind seven jobs is why run 34331702738 ended with no build evidence at all. The
    # release gate below still refuses to pass unless build AND every other required job
    # actually succeeded — independence widens the evidence, it does not lower the bar.
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
      - run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web
      - run: pnpm exec playwright test --project=mobile-chrome --workers=4 tests/e2e/landing-motion.spec.ts tests/e2e/visual-regression.spec.ts tests/e2e/smoke.spec.ts tests/e2e/phase9-auth.spec.ts
        working-directory: apps/web
        env:
          CI: true

  lighthouse-mobile:
    name: Lighthouse mobile gate
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feat/')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
      - run: pnpm --filter @fitconnect/web start &
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
      - run: npx wait-on http://localhost:3001/api/health --timeout 120000
      - run: node scripts/lighthouse-mobile.mjs http://localhost:3001
        env:
          CI: "true"
          LIGHTHOUSE_MIN_PERF: "84"
          LIGHTHOUSE_MIN_A11Y: "90"
          LIGHTHOUSE_MIN_BP: "95"
          LIGHTHOUSE_MIN_SEO: "95"

  test-perf:
    name: k6 smoke
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fitconnect/web start &
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
      - run: npx wait-on http://localhost:3001/api/health --timeout 120000
      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - run: k6 run scripts/perf/k6-smoke.js
        env:
          BASE_URL: http://localhost:3001

  deploy-staging:
    name: Deploy staging smoke
    runs-on: ubuntu-latest
    needs: [test-e2e, test-perf]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Smoke health endpoint
        run: curl -fsS "${{ secrets.STAGING_URL || 'https://fitconnect-phi.vercel.app' }}/api/health" | grep -q '"status"'

  # Final release gate — independent validation jobs run in parallel above; this job
  # fails the workflow if any required check did not succeed (never treats SKIPPED as PASS).
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-typecheck
      - test-unit
      - test-coverage-gate
      - test-integration
      - security-audit
      - auth-prod-like
      - android-wear
      - build
      - test-e2e
      # Aggregated as of 2026-09-12. It was deliberately left out while its `if:` was
      # main/master/feature-only; commit a727bc2 widened that to feat/** so it runs, and can
      # fail, on this branch -- and CI #39 then ended in FAILURE while this gate reported
      # SUCCESS. A job that can fail the workflow must be visible to the gate.
      - lighthouse-mobile
    steps:
      - name: Require green required jobs
        env:
          # Unconditional jobs: only `success` is acceptable.
          R_LINT: ${{ needs.lint-typecheck.result }}
          R_UNIT: ${{ needs.test-unit.result }}
          R_COVERAGE: ${{ needs.test-coverage-gate.result }}
          R_INTEGRATION: ${{ needs.test-integration.result }}
          R_SECURITY: ${{ needs.security-audit.result }}
          R_AUTH: ${{ needs.auth-prod-like.result }}
          R_ANDROID: ${{ needs.android-wear.result }}
          R_BUILD: ${{ needs.build.result }}
          R_E2E: ${{ needs.test-e2e.result }}
          # Branch-conditional: `success` OR `skipped`. Never `failure`/`cancelled`.
          R_LIGHTHOUSE: ${{ needs.lighthouse-mobile.result }}
        run: |
          set -euo pipefail
          fail=0

          echo "Required jobs (must be success):"
          for pair in \
            "lint-typecheck=$R_LINT" "test-unit=$R_UNIT" "test-coverage-gate=$R_COVERAGE" \
            "test-integration=$R_INTEGRATION" "security-audit=$R_SECURITY" \
            "auth-prod-like=$R_AUTH" "android-wear=$R_ANDROID" "build=$R_BUILD" \
            "test-e2e=$R_E2E"; do
            name="${pair%%=*}"; res="${pair#*=}"
            printf '  %-20s %s\n' "$name" "$res"
            if [ "$res" != "success" ]; then
              echo "    ^ BLOCKING: not success"
              fail=1
            fi
          done

          # lighthouse-mobile is branch-conditional (main/master/feature/**/feat/**). When the
          # branch filter excludes it the job is skipped and that is correct, so skipped is
          # accepted -- but a job that RAN and failed blocks the release. This is the only
          # tolerance in the gate and it tolerates absence, never failure.
          echo "Branch-conditional jobs (success or skipped):"
          printf '  %-20s %s\n' "lighthouse-mobile" "$R_LIGHTHOUSE"
          case "$R_LIGHTHOUSE" in
            success|skipped) ;;
            *) echo "    ^ BLOCKING: lighthouse-mobile ran and did not succeed"; fail=1 ;;
          esac

          echo
          echo "NOT covered by this gate: test-perf, deploy-staging (both main/master-only,"
          echo "and deploy-staging smokes a deployed environment rather than this commit)."
          echo "scripts/ci-gate-lint.mjs enforces that every other job is aggregated here."

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Release gate BLOCKED."
            exit 1
          fi
          echo
          echo "Release gate PASS — every required job succeeded."
