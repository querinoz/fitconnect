name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_DEMO_MODE: "true"
  NEXT_PUBLIC_REALTIME_PROVIDER: broadcast

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web

      - name: Phase 9 + Voltline E2E
        run: >
          pnpm test:e2e --
          --project=mobile-chrome
          --workers=1
          tests/e2e/phase9-auth.spec.ts
          tests/e2e/phase9-admin.spec.ts
          tests/e2e/phase9-community.spec.ts
          tests/e2e/phase9-programs.spec.ts
          tests/e2e/phase9-booking.spec.ts
          tests/e2e/smoke.spec.ts
          tests/e2e/celebrations.spec.ts
          tests/e2e/live-session.spec.ts
          tests/e2e/morning-handshake.spec.ts
        env:
          CI: true
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_REALTIME_PROVIDER: broadcast
