name: Vercel Production

on:
  push:
    branches: [main, master, feature/fitconnect, feat/elite-os-v2]
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
  STRIPE_PRICE_ATHLETE_MONTHLY: ${{ secrets.STRIPE_PRICE_ATHLETE_MONTHLY }}
  STRIPE_PRICE_ATHLETE_ANNUAL: ${{ secrets.STRIPE_PRICE_ATHLETE_ANNUAL }}
  STRIPE_PRICE_TEAM_MONTHLY: ${{ secrets.STRIPE_PRICE_TEAM_MONTHLY }}
  STRIPE_PRICE_TEAM_ANNUAL: ${{ secrets.STRIPE_PRICE_TEAM_ANNUAL }}
  STRIPE_PRICE_COACH_MONTHLY: ${{ secrets.STRIPE_PRICE_COACH_MONTHLY }}
  STRIPE_PRICE_COACH_ANNUAL: ${{ secrets.STRIPE_PRICE_COACH_ANNUAL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
  NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
  LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
  LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
  NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  deploy:
    name: Deploy @fitconnect/web
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test before production deploy
        run: pnpm --filter @fitconnect/web test

      - name: Typecheck before production deploy
        run: pnpm --filter @fitconnect/web typecheck

      - name: Apply Supabase migrations
        continue-on-error: true
        run: pnpm db:supabase:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Check Vercel auth
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel production secrets missing (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID). Run 34710860100 reported SUCCESS while skipping Pull/Build/Deploy, so https://fitconnect-phi.vercel.app stayed on a pre-Session-6 artifact (~96 KiB page chunk with GSAP, ~755 KiB transfer, Performance ~65)."
            exit 1
          fi
          echo "VERCEL_TOKEN is set (length ${#VERCEL_TOKEN})"
          if [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ] || [ -z "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" ] || [ -z "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" ] || [ -z "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" ] || [ -z "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" ] || [ -z "$NEXT_PUBLIC_FIREBASE_APP_ID" ]; then
            echo "::error::Firebase web config missing in the GitHub production environment (NEXT_PUBLIC_FIREBASE_*). Production /api/health reported AUTH_UNAVAILABLE while DEMO_MODE=false."
            exit 1
          fi
          echo "Firebase web config is set (apiKey length ${#NEXT_PUBLIC_FIREBASE_API_KEY})"

      # Run from repo root. The Vercel project Root Directory is apps/web;
      # running these steps inside apps/web makes deploy look for apps/web/apps/web
      # (run 34773470298 attempt 1: path does not exist).
      - name: Pull Vercel env
        run: |
          set +e
          pnpm dlx vercel@48.12.1 whoami > /tmp/vercel-pull.log 2>&1
          whoami_code=$?
          echo "----- vercel whoami (exit $whoami_code) -----"
          sed -E 's/[A-Za-z0-9_\-]{24,}/[redacted]/g' /tmp/vercel-pull.log | tail -n 20
          if [ $whoami_code -ne 0 ]; then
            echo "::error::Vercel token cannot authenticate (whoami failed). Rotate VERCEL_TOKEN in the production GitHub environment."
            exit 1
          fi
          pnpm dlx vercel@48.12.1 pull --yes --environment=production > /tmp/vercel-pull.log 2>&1
          code=$?
          echo "----- vercel pull (exit $code) -----"
          sed -E 's/[A-Za-z0-9_\-]{24,}/[redacted]/g' /tmp/vercel-pull.log | tail -n 40
          exit $code

      # vercel pull does not include GitHub environment secrets. Bake the public
      # Firebase web config into the pulled env files so `vercel build --prod`
      # inlines it (production /api/health was AUTH_UNAVAILABLE without this).
      - name: Inject GitHub production secrets into Vercel env
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          required = [
              "NEXT_PUBLIC_FIREBASE_API_KEY",
              "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
              "NEXT_PUBLIC_FIREBASE_PROJECT_ID",
              "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",
              "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
              "NEXT_PUBLIC_FIREBASE_APP_ID",
          ]
          optional = [
              "STRIPE_SECRET_KEY",
              "STRIPE_WEBHOOK_SECRET",
              "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY",
              "STRIPE_PRICE_ATHLETE_MONTHLY",
              "STRIPE_PRICE_ATHLETE_ANNUAL",
              "STRIPE_PRICE_TEAM_MONTHLY",
              "STRIPE_PRICE_TEAM_ANNUAL",
              "STRIPE_PRICE_COACH_MONTHLY",
              "STRIPE_PRICE_COACH_ANNUAL",
              "UPSTASH_REDIS_REST_URL",
              "UPSTASH_REDIS_REST_TOKEN",
              "NEXT_PUBLIC_POSTHOG_KEY",
              "NEXT_PUBLIC_POSTHOG_HOST",
              "NEXT_PUBLIC_SENTRY_DSN",
              "LIVEKIT_API_KEY",
              "LIVEKIT_API_SECRET",
              "NEXT_PUBLIC_LIVEKIT_URL",
              "OPENAI_API_KEY",
          ]
          keys = required + optional
          paths = [
              Path(".vercel/.env.production.local"),
              Path("apps/web/.vercel/.env.production.local"),
          ]
          injected_optional = 0
          for path in paths:
              text = path.read_text(encoding="utf-8") if path.exists() else ""
              lines = [
                  ln for ln in text.splitlines()
                  if not any(ln.startswith(f"{k}=") for k in keys)
              ]
              for key in required:
                  value = os.environ.get(key, "").strip()
                  if not value:
                      raise SystemExit(f"missing {key}")
                  lines.append(f"{key}={value}")
              for key in optional:
                  value = os.environ.get(key, "").strip()
                  if not value:
                      continue
                  injected_optional += 1
                  lines.append(f"{key}={value}")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(
              f"injected {len(required)} required Firebase keys; "
              f"{injected_optional} optional secret slots were non-empty "
              f"(counted across {len(paths)} env files)"
          )
          PY

      - name: Build with Vercel
        run: pnpm dlx vercel@48.12.1 build --prod
        env:
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_REALTIME_PROVIDER: broadcast
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy prebuilt
        run: pnpm dlx vercel@48.12.1 deploy --prebuilt --prod
