name: iOS

on:
  push:
    branches: [main, master, feature/**, feat/**]
  pull_request:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  static-parity:
    name: iOS static parity (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-swift-duplicate-decls.mjs
      - run: node scripts/check-ios-parity.mjs
      - run: node scripts/ios-device-check.mjs
      - run: node scripts/check-ios-testflight.mjs

  ios-simulator:
    name: iOS + watchOS simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Simulator build + test
        run: chmod +x scripts/ios-sim-test scripts/ios-device-check scripts/ios-device-build scripts/ios-device-install && ./scripts/ios-sim-test
