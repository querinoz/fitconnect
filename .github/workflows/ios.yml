name: iOS

on:
  push:
    branches: [main, master, feature/**, feat/**]
  pull_request:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  static-parity:
    name: iOS static parity (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-swift-duplicate-decls.mjs
      - run: node scripts/check-ios-parity.mjs

  ios-simulator:
    name: iOS + watchOS simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build iOS (unsigned simulator)
        working-directory: iosApp
        run: |
          xcodebuild \
            -scheme FitConnect \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Test iOS simulator
        working-directory: iosApp
        run: |
          set +e
          for dest in \
            "platform=iOS Simulator,name=iPhone 16" \
            "platform=iOS Simulator,name=iPhone 16 Pro" \
            "platform=iOS Simulator,name=iPhone 15"; do
            xcodebuild \
              -scheme FitConnect \
              -destination "$dest" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              test
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
          done
          exit "$status"
      - name: Build watchOS (unsigned simulator)
        working-directory: iosApp
        run: |
          xcodebuild \
            -scheme FitConnectWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
