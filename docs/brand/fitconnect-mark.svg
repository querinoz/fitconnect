<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none" role="img" aria-label="FitConnect">
  <title>FitConnect</title>
  <!--
    Canonical FitConnect mark — circular reticle + block F + ECG.
    Source of truth: brand-sources/fitconnect-logo-mark.svg
    Photoref: brand-sources/fitconnect-logo-source.png
    Colors: Voltline #C8FF00 · White #FFFFFF · transparent BG
  -->
  <defs>
    <filter id="fcMarkGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#C8FF00" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2.8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#fcMarkGlow)">
    <circle cx="160" cy="142" r="108" stroke="#C8FF00" stroke-width="3.5" fill="none"/>
    <circle cx="160" cy="142" r="96" stroke="#C8FF00" stroke-width="1.75" fill="none"/>

    <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square">
      <line x1="160" y1="26" x2="160" y2="44"/>
      <line x1="160" y1="240" x2="160" y2="258"/>
      <line x1="44" y1="142" x2="62" y2="142"/>
      <line x1="258" y1="142" x2="276" y2="142"/>
    </g>

    <!--
      White F: top bar (with underside notch near right) + stem.
      Foot cut slopes ↗ (left lower → right higher).
    -->
    <path
      fill="#FFFFFF"
      d="M118 68 H216 V94 H205 L200 88 L195 94 H146 V208 L118 238 Z"
    />
    <!-- Voltline mid-bar — parallelogram; left edge // foot cut -->
    <path
      fill="#C8FF00"
      d="M146 122 H200 V146 H124 Z"
    />

    <!-- ECG: baseline → up spike → deep valley → recover -->
    <path
      d="M70 248 H122 L138 248 L148 214 L158 278 L170 248 H250"
      stroke="#C8FF00"
      stroke-width="3.5"
      stroke-linecap="square"
      stroke-linejoin="miter"
      fill="none"
    />
  </g>
</svg>
