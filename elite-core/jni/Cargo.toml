[package]
name = "elite-core-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is what Android/Gradle packages into the .so per ABI; rlib kept for local testing.
crate-type = ["cdylib", "rlib"]

[dependencies]
elite-core = { path = "../core" }
jni = "0.21"
