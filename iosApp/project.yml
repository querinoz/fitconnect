name: FitConnect
options:
  bundleIdPrefix: com.fitconnect
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.8.0
targets:
  FitConnect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitConnect
    entitlements:
      path: FitConnect/FitConnect.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios
        PRODUCT_NAME: FitConnect
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FitConnect
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: FitConnect reads heart rate, HRV, sleep, energy, distance and steps you authorize so training and recovery can use real Apple Health samples. Missing stays missing.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: FitConnect may write workout sessions you start in TRAIN or Fight Mode into Apple Health. It does not invent samples.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: FitConnect uses Bluetooth to connect instrumented gloves, bags, pads and bands when you pair them. No hardware is invented.
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: FitConnect connects to combat and training accessories you select.
        INFOPLIST_KEY_NSMotionUsageDescription: FitConnect may read device motion for orientation and acceleration. Acceleration is never shown as measured punch force.
        INFOPLIST_KEY_UIBackgroundModes: workout
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - target: FitConnectWatch
        embed: true
        codeSign: false
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAuth
  FitConnectWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FitConnectWatch
      - path: FitConnect/Train/CombatContract.swift
      - path: FitConnect/Health/SensorHonesty.swift
      - path: FitConnect/Health/LiveWorkoutSession.swift
      - path: FitConnect/Health/CoreMotionSession.swift
    entitlements:
      path: FitConnectWatch/FitConnectWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios.watchkitapp
        PRODUCT_NAME: FitConnect Watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FitConnect
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.fitconnect.ios
        INFOPLIST_KEY_NSHealthShareUsageDescription: The watch reads heart rate during an active workout session you start.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: The watch writes the workout session you start so it can continue in the background.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        TARGETED_DEVICE_FAMILY: 4
  FitConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitConnectTests
    dependencies:
      - target: FitConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FitConnect:
    build:
      targets:
        FitConnect: all
        FitConnectTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitConnectTests
  FitConnectWatch:
    build:
      targets:
        FitConnectWatch: all
    run:
      config: Debug
