name: FitConnect
options:
  bundleIdPrefix: com.fitconnect
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios
    DEVELOPMENT_TEAM: ""
targets:
  FitConnect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FitConnect
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: FitConnect
        INFOPLIST_KEY_CFBundleName: FitConnect
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
name: FitConnect
options:
  bundleIdPrefix: com.fitconnect
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  FitConnect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.patha
        PRODUCT_NAME: FitConnect
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FitConnect
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        SUPPORTS_MACCATALYST: NO
schemes:
  FitConnect:
    build:
      targets:
        FitConnect: all
    run:
      config: Debug
