name: FitConnect
options:
  bundleIdPrefix: com.fitconnect
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.8.0
targets:
  FitConnect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitConnect
      - path: GoogleService-Info.plist
        type: file
        optional: true
        buildPhase: resources
    entitlements:
      path: FitConnect/FitConnect.entitlements
    info:
      properties:
        FITCONNECT_ENV: $(FITCONNECT_ENV)
        FITCONNECT_API_BASE_URL: $(FITCONNECT_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios
        PRODUCT_MODULE_NAME: FitConnect
        PRODUCT_NAME: FitConnect
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FitConnect/FitConnect.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: FitConnect
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: FitConnect reads heart rate, HRV, sleep, energy, distance and steps you authorize so training and recovery can use real Apple Health samples. Missing stays missing.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: FitConnect may write workout sessions you start in TRAIN or Fight Mode into Apple Health. It does not invent samples.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: FitConnect uses Bluetooth to connect instrumented gloves, bags, pads and bands when you pair them. No hardware is invented.
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: FitConnect connects to combat and training accessories you select.
        INFOPLIST_KEY_NSMotionUsageDescription: FitConnect may read device motion for orientation and acceleration. Acceleration is never shown as measured punch force.
        INFOPLIST_KEY_UIBackgroundModes: [workout, processing, remote-notification]
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: [com.fitconnect.ios.refresh]
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: FitConnect/FitConnect.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: FitConnect/FitConnectRelease.entitlements
    dependencies:
      - target: FitConnectWatch
        embed: true
      - target: FitConnectWidgets
        embed: true
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAuth
  FitConnectWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FitConnectWatch
      - path: FitConnect/Train/CombatContract.swift
      - path: FitConnect/Health/SensorHonesty.swift
      - path: FitConnect/Health/LiveWorkoutSession.swift
      - path: FitConnect/Health/CoreMotionSession.swift
      - path: FitConnect/Glance/BackgroundWorkload.swift
      - path: FitConnect/Glance/GlanceSharedStore.swift
    entitlements:
      path: FitConnectWatch/FitConnectWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios.watchkitapp
        PRODUCT_MODULE_NAME: FitConnectWatch
        PRODUCT_NAME: FitConnect Watch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FitConnect
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.fitconnect.ios
        INFOPLIST_KEY_NSHealthShareUsageDescription: The watch reads heart rate during an active workout session you start.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: The watch writes the workout session you start so it can continue in the background.
        INFOPLIST_KEY_NSMotionUsageDescription: The watch may read motion for orientation. Acceleration is never punch force.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        TARGETED_DEVICE_FAMILY: 4
        INFOPLIST_KEY_UIBackgroundModes: workout
  FitConnectWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitConnectWidgets
      - path: FitConnect/Glance/BackgroundWorkload.swift
      - path: FitConnect/Glance/GlanceSharedStore.swift
      - path: FitConnect/Glance/TrainLiveAttributes.swift
      - path: FitConnect/Glance/TrainLiveIntents.swift
    entitlements:
      path: FitConnectWidgets/FitConnectWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios.widgets
        PRODUCT_MODULE_NAME: FitConnectWidgets
        PRODUCT_NAME: FitConnectWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FitConnectWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: FitConnect
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: YES
  FitConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitConnectTests
    dependencies:
      - target: FitConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios.tests
        PRODUCT_MODULE_NAME: FitConnectTests
        GENERATE_INFOPLIST_FILE: YES
  FitConnectWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: FitConnectWatchTests
    dependencies:
      - target: FitConnectWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitconnect.ios.watchkitapp.tests
        PRODUCT_MODULE_NAME: FitConnectWatchTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FitConnect:
    build:
      targets:
        FitConnect: all
        FitConnectWidgets: all
        FitConnectWatch: all
        FitConnectTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitConnectTests
    archive:
      config: Release
  FitConnectWatch:
    build:
      targets:
        FitConnectWatch: all
        FitConnectWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitConnectWatchTests
    archive:
      config: Release
