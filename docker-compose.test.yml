# Local + CI test stack
services:
  db-test:
    image: postgres:15-alpine
    container_name: fitconnect-test-db
    environment:
      POSTGRES_USER: fitconnect
      POSTGRES_PASSWORD: fitconnect_test
      POSTGRES_DB: fitconnect_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitconnect -d fitconnect_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: fitconnect-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: fitconnect-pact-broker
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://fitconnect:fitconnect_test@db-test:5432/fitconnect_test
      PACT_BROKER_BASIC_AUTH_USERNAME: pact
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    depends_on:
      db-test:
        condition: service_healthy
