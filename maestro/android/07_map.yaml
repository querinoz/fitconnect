# 07 — Map panel on Discover (deterministic fixture markers)
appId: com.fitconnect.android.debug
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen_guest"
    timeout: 10000
- tapOn:
    id: "screen_guest_primary"
- tapOn:
    id: "screen_auth_primary"
- runFlow: _complete_onboarding.yaml
- extendedWaitUntil:
    visible:
      id: "athlete_os"
    timeout: 12000
- tapOn:
    id: "athlete_tab_discover"
- extendedWaitUntil:
    visible:
      id: "athlete_map_panel"
    timeout: 8000
- assertVisible: "LOCAL MAP"
- assertVisible: "Book intro"
