# 03 — Athlete social-first IA (Feed · Ascend · Train FAB · Dashboard · Profile)
appId: com.fitconnect.android.debug
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen_guest"
    timeout: 10000
- tapOn:
    id: "screen_guest_primary"
- tapOn:
    id: "screen_auth_primary"
- runFlow: _complete_onboarding.yaml
- extendedWaitUntil:
    visible:
      id: "athlete_os"
    timeout: 12000
- assertVisible:
    id: "athlete_feed"
- assertVisible:
    id: "athlete_tab_feed"
- assertVisible:
    id: "athlete_tab_ascend"
- assertVisible:
    id: "athlete_tab_dashboard"
- assertVisible:
    id: "athlete_tab_profile"
# Instagram-style: open discovery via a11y edge control (or swipe from left)
- tapOn:
    id: "feed_menu_open"
- assertVisible:
    id: "feed_side_sheet"
- assertVisible:
    id: "feed_menu_find_coach"
- assertVisible: "Find a Specialist"
- assertVisible: "Help"
- tapOn:
    id: "feed_menu_find_coach"
- assertVisible:
    id: "athlete_discover"
- tapOn:
    id: "athlete_tab_ascend"
- tapOn:
    id: "athlete_tab_dashboard"
- tapOn:
    id: "athlete_tab_profile"
- assertVisible:
    id: "athlete_profile"
- tapOn:
    id: "athlete_tab_feed"
- assertVisible:
    id: "athlete_feed"
