# Maestro smoke — foundation shell only (no athlete/coach features).
# Requires a running emulator/device with the debug APK installed.
appId: com.fitconnect.android.debug
---
- launchApp
- assertVisible:
    id: "screen_splash"
- extendedWaitUntil:
    visible:
      id: "screen_guest"
    timeout: 5000
- tapOn:
    id: "screen_guest_primary"
- assertVisible:
    id: "screen_auth"
