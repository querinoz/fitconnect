# 01 — Authentication: guest → unified email login → athlete session
appId: com.fitconnect.android.debug
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen_guest"
    timeout: 10000
- tapOn:
    id: "screen_guest_primary"
- assertVisible:
    id: "screen_auth"
- assertVisible: "Welcome back"
- tapOn:
    id: "auth_email"
- inputText: "ines@fitconnect.demo"
- tapOn:
    id: "auth_password"
- inputText: "password1"
- tapOn:
    id: "auth_submit"
- runFlow: _complete_onboarding.yaml
- extendedWaitUntil:
    visible:
      id: "athlete_os"
    timeout: 12000
- assertVisible:
    id: "athlete_home"
