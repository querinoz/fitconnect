# 09 — Profile + settings + sign out
appId: com.fitconnect.android.debug
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen_guest"
    timeout: 10000
- tapOn:
    id: "screen_guest_primary"
- tapOn:
    id: "screen_auth_primary"
- runFlow: _complete_onboarding.yaml
- extendedWaitUntil:
    visible:
      id: "athlete_os"
    timeout: 12000
- tapOn:
    id: "athlete_tab_profile"
- assertVisible:
    id: "athlete_profile"
- tapOn:
    id: "athlete_open_settings"
- assertVisible:
    id: "athlete_settings"
- assertVisible:
    id: "language_picker"
- tapOn:
    id: "athlete_tab_profile"
- assertVisible:
    id: "athlete_profile"
- tapOn:
    id: "athlete_sign_out"
- extendedWaitUntil:
    visible:
      id: "screen_guest"
    timeout: 10000
