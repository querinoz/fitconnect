appId: com.fitconnect.android
---
- launchApp
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
- tapOn: "Continue"
- runFlow: ../_unified_email_login_coach.yaml
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            visible: "ACTIVE EXPERIENCE"
          commands:
            - tapOn: "Coach"
      - runFlow:
          when:
            visible: "Enter Coach OS"
          commands:
            - tapOn: "Enter Coach OS"
      - runFlow:
          when:
            visible: "Skip for now"
          commands:
            - tapOn: "Skip for now"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Feed"
    timeout: 45000
- assertVisible: "Feed"
- assertVisible: "Dashboard"
- takeScreenshot: cross_coach_feed
- tapOn: "Dashboard"
- takeScreenshot: cross_coach_dashboard
