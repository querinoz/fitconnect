# Shared: unified email login (no Athlete/Coach chooser)
appId: com.fitconnect.android
---
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 20000
- tapOn:
    id: "auth_email"
- inputText: "ines@fitconnect.demo"
- tapOn:
    id: "auth_password"
- inputText: "password1"
- tapOn:
    id: "auth_submit"
